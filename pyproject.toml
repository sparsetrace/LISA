[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "faiss-cpu>=1.7.4",
  "tables>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
